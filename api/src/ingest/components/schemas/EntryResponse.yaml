description: Entry object
type: object
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  parent_id:
    type: string
    format: uuid
    nullable: true
  type:
    type: string
    enum:
      - file
      - directory
  size:
    type: integer
    format: int64
    nullable: true
  media_type:
    type: string
    nullable: true
  metadata:
    type: object
    additionalProperties: true
    nullable: true
  created:
    type: string
    format: date-time
  last_modified:
    type: string
    format: date-time
  raw_access:
    type: boolean
  entry_status:
    type: string
    enum:
      - unavailable
      - deleted
      - staged
      - ready
